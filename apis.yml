name: Reiner.ai
description: 'Reiner.ai (operated by AI Mapping GmbH of Cologne, Germany) is a construction-
  and planning-industry AI platform for architects, engineers, and planners. It combines
  leading LLMs with domain-specific "Reiner Knowledge" and "Reiner Logic" layers to
  deliver Reiner Chat, task-specific KI-Agenten (AI agents) for site protocols, explanatory
  reports and project applications, company-knowledge integration, and a library of
  50+ prebuilt construction prompts. The product is delivered as a hosted web application
  (app.reiner.ai); as of this enrichment pass there is no public developer API, SDKs,
  or developer documentation.'
